[project]
name = "vibectl"
version = "0.1.0"
description = "Set up and control a Fly.io coding VM from the machine running flyctl"
requires-python = ">=3.11"
dependencies = []                      # stdlib only: argparse, subprocess, urllib

[project.scripts]
vibectl = "vibectl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vibectl"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
