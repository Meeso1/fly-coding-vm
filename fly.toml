app = "coding-vm" # placeholder: vibectl always passes `-a $FLY_APP`; a bare `fly deploy` targets this name (must be globally unique)
primary_region = "iad" # machines are deployed here; `vibectl init --region <r>` rewrites this line

[build]
  dockerfile = "Dockerfile"

[[vm]]
  cpu_kind = "shared"
  cpus = 8
  memory_mb = 8192 # shared-cpu-8x/8 GB ~= $0.07/h; tune to your needs

[[restart]]
  policy = "never"

[mounts]
  source = "data"
  destination = "/data"
