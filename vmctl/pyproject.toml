[project]
name = "vmctl"
version = "0.1.0"
description = "Local CLI to manage the fly-coding-vm from the machine running flyctl"
requires-python = ">=3.11"
dependencies = []                      # stdlib only: argparse, subprocess, urllib

[project.scripts]
vmctl = "vmctl.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vmctl"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
