[project]
name = "vm-tools"
version = "0.1.0"
description = "Small CLI tools for a Fly.io coding VM (GitHub App tokens, repo checkout, idle watcher)"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=43",
    "httpx>=0.28",
]

[project.scripts]
vm-tools = "vm_tools.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vm_tools"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
